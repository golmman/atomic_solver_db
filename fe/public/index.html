<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Atomic Solver Proof Tree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Atomic Solver Proof Tree</h1>
  </header>

  <main>
    <section id="board-section" aria-label="Chess board">
      <div id="board-wrapper">
        <div id="board"></div>
        <svg id="arrow" width="100%" height="100%">
          <defs>
            <marker
              id="arrowhead"
              viewBox="0 0 10 10"
              refX="8"
              refY="5"
              markerWidth="10"
              markerHeight="10"
              markerUnits="userSpaceOnUse"
              orient="auto"
            >
              <path d="M0,0 L0,10 L9,5 z" fill="#d32f2f" />
            </marker>
          </defs>
          <line id="arrow-line" x1="0" y1="0" x2="0" y2="0" stroke="#d32f2f" stroke-width="5" marker-end="url(#arrowhead)" />
        </svg>
      </div>
      <div id="fen-box">
        <strong>FEN:</strong> <code id="fen"></code>
      </div>
      <div id="meta-box">
        <p><strong>Root outcome:</strong> <span id="root-outcome"></span></p>
        <p><strong>Root depth:</strong> <span id="root-depth"></span></p>
        <p><strong>Node count:</strong> <span id="node-count"></span></p>
      </div>
    </section>

    <aside id="sidebar" aria-label="Moves and history">
      <section id="moves-panel">
        <h2>Available moves</h2>
        <ul id="moves"></ul>
        <p id="no-moves" class="empty">No child moves</p>
      </section>

      <section id="history-panel">
        <h2>Current line</h2>
        <button id="undo" disabled>Undo last move</button>
        <ol id="history"></ol>
      </section>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
