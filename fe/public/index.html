<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Atomic Solver Proof Tree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Atomic Solver Proof Tree</h1>
  </header>

  <main>
    <aside id="history-sidebar" aria-label="Current line">
      <section id="history-panel">
        <h2>Current line</h2>
        <button id="undo" disabled>Undo last move</button>
        <ol id="history"></ol>
      </section>
      <section id="views-panel" aria-label="Views"></section>
    </aside>

    <section id="board-section" aria-label="Board and load status">
      <div id="board-wrapper">
        <div id="board"></div>
        <svg id="arrow" width="100%" height="100%">
          <defs>
            <marker
              id="arrowhead"
              viewBox="0 0 10 10"
              refX="8"
              refY="5"
              markerWidth="10"
              markerHeight="10"
              markerUnits="userSpaceOnUse"
              orient="auto"
            >
              <path d="M0,0 L0,10 L9,5 z" fill="#d32f2f" />
            </marker>
          </defs>
          <line id="arrow-line" x1="0" y1="0" x2="0" y2="0" stroke="#d32f2f" stroke-width="5" marker-end="url(#arrowhead)" />
        </svg>
      </div>
      <div id="node-status"></div>
      <div id="fen-box">
        <strong>FEN:</strong> <code id="fen"></code>
      </div>
      <div id="meta-box" class="hidden"></div>
      <div id="gate-panel" aria-live="polite">
        <p id="boot-status" class="boot-status">Booting…</p>
      </div>
    </section>

    <aside id="moves-sidebar" aria-label="Available moves">
      <section id="moves-panel">
        <h2>Available moves</h2>
        <h3>Recorded children</h3>
        <ul id="moves"></ul>
        <p id="no-moves" class="empty hidden">No recorded children</p>
        <h3>Legal replies without records</h3>
        <p id="unknown-intro" class="empty hidden">No recorded facts for this position.</p>
        <ul id="unknown-moves"></ul>
        <p id="no-legal" class="empty hidden">No legal moves in this position.</p>
      </section>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
