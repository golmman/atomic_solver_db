<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Atomic Solver Proof Tree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Atomic Solver Proof Tree</h1>
  </header>

  <main>
    <aside id="history-sidebar" aria-label="Current line">
      <section id="history-panel">
        <h2>Current line</h2>
        <button id="undo" disabled>Undo last move</button>
        <p class="empty">Board navigation arrives with the board phase.</p>
      </section>
    </aside>

    <section id="board-section" aria-label="Database load status">
      <div id="gate-panel" aria-live="polite">
        <p id="boot-status" class="boot-status">Booting…</p>
      </div>
    </section>

    <aside id="moves-sidebar" aria-label="Available moves">
      <section id="moves-panel">
        <h2>Available moves</h2>
        <p id="no-moves" class="empty">No child moves</p>
      </section>
    </aside>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
